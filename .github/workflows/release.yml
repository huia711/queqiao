name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the DMGs to (e.g. v0.2.0); leave empty to only upload artifacts"
        required: false
        default: ""
      arch:
        description: "Which architectures to build"
        required: false
        default: "all"
        type: choice
        options: [all, arm64, x86_64]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ARCH: ${{ inputs.arch || 'all' }}
        run: |
          arm='{"arch":"arm64","runner":"macos-15"}'
          intel='{"arch":"x86_64","runner":"macos-15-intel"}'
          case "$ARCH" in
            arm64) include="[$arm]" ;;
            x86_64) include="[$intel]" ;;
            *) include="[$arm,$intel]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Build app and DMG
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Queqiao-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.sha256
