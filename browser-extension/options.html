<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>鹊桥翻译 · 设置</title>
  <style>
    body { margin: 0; padding: 28px; background: #f6f3ee; color: #1d1b18; font: 14px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { max-width: 520px; }
    h1 { margin: 0 0 10px; font: 700 20px Georgia, "Songti SC", serif; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 9px 12px; border: 1px solid #d6cdbf; border-radius: 8px; font: 14px ui-monospace, Menlo, monospace; }
    .choices { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; border: 1px solid #d6cdbf; border-radius: 8px; background: #fff; cursor: pointer; }
    button.primary { background: #8b2e3c; border-color: #8b2e3c; color: #fff; }
    p { color: #4f4b45; }
    #status { color: #1d6b5e; }
  </style>
</head>
<body>
  <main>
    <h1>鹊桥翻译</h1>
    <p>点工具栏图标、arXiv 页面上的「鹊桥翻译」按钮或右键菜单时，会打开下面这个鹊桥地址。</p>
    <label for="base">鹊桥地址</label>
    <input id="base" spellcheck="false">
    <div class="choices">
      <button data-base="http://127.0.0.1:8686">本机（127.0.0.1:8686）</button>
      <button data-base="https://weiyao2.evalx.xyz/queqiao">公网（weiyao2.evalx.xyz/queqiao）</button>
    </div>
    <p><button class="primary" id="save">保存</button> <span id="status"></span></p>
  </main>
  <script src="paper.js"></script>
  <script src="options.js"></script>
</body>
</html>
