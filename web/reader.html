<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>对照阅读 · 鹊桥</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var saved = localStorage.getItem("qq-theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.dataset.theme = "dark";
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/reader.css">
</head>
<body class="reader-body">
  <header class="reader-bar">
    <div class="bar-left">
      <a class="icon-btn" href="/library" title="返回文库" aria-label="返回文库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6l-6 6 6 6"/></svg>
      </a>
      <a class="mini-brand" href="/" title="鹊桥首页">鹊桥</a>
      <span class="bar-sep"></span>
      <div class="segmented" role="tablist" aria-label="视图">
        <button data-view="original" title="只看原文（1）">原文</button>
        <button data-view="translated" title="只看译文（2）">译文</button>
        <button data-view="split" class="active" title="左右对照（3）">对照</button>
      </div>
      <button class="icon-btn" id="swapBtn" title="交换左右" aria-label="交换左右">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <button class="icon-btn active" id="syncBtn" title="同步滚动" aria-label="同步滚动" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
    </div>

    <div class="bar-center">
      <div class="note-tools" role="toolbar" aria-label="笔记工具">
        <button class="tool active" data-tool="0" title="阅读（选中文字后可一键高亮）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8.5-6.2 1.4L9.6 19z"/></svg>
          <span>阅读</span>
        </button>
        <button class="tool" data-tool="9" title="高亮：拖选文字">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-4 4h6l1.5-1.5M9 15l7.5-7.5a2.1 2.1 0 0 1 3 3L12 18M9 15l3 3"/></svg>
          <span>高亮</span>
        </button>
        <button class="tool" data-tool="3" title="文字批注：点击页面任意位置输入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
          <span>批注</span>
        </button>
        <button class="tool" data-tool="15" title="画笔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3-1 4.5-2.5 6-5s3.5-9 7-11 5 1 4 3-5 5-9 7-6 4-8 6z"/></svg>
          <span>画笔</span>
        </button>
        <span class="save-state" id="saveState" title="笔记保存状态"><span class="dot"></span><span class="label">笔记保存在本机</span></span>
      </div>
    </div>

    <div class="bar-right">
      <button class="text-btn" id="notesBtn" title="笔记列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>
        <span>笔记</span><b class="count-badge" id="notesCount">0</b>
      </button>
      <button class="text-btn" id="infoBtn" title="论文信息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <span>信息</span>
      </button>
      <button class="icon-btn" id="toolbarBtn" title="展开 PDF 工具栏（搜索、缩放、更多批注选项）" aria-label="展开 PDF 工具栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" id="moreBtn" title="更多操作" aria-label="更多操作" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="menu hidden" id="moreMenu" role="menu">
          <div class="menu-label">下载</div>
          <a role="menuitem" data-download="translated">译文 PDF<small data-note-hint="translated"></small></a>
          <a role="menuitem" data-download="original">原文 PDF<small data-note-hint="original"></small></a>
          <a role="menuitem" data-download="dual">双语对照 PDF</a>
          <a role="menuitem" data-download="source">译文 LaTeX 源码</a>
          <a role="menuitem" data-clean="translated">译文 PDF（不含笔记）</a>
          <a role="menuitem" data-download="log">构建日志</a>
          <div class="menu-sep"></div>
          <div class="menu-label">PDF 阅读颜色</div>
          <div class="menu-choices" id="pageColorChoices">
            <button data-pagecolor="original">原色</button>
            <button data-pagecolor="sepia">护眼</button>
            <button data-pagecolor="night">夜间</button>
            <button data-pagecolor="auto">跟随主题</button>
          </div>
          <div class="menu-sep"></div>
          <a role="menuitem" id="themeItem">切换到深色主题</a>
          <a role="menuitem" id="retranslateItem">用其他模型重新翻译</a>
          <a role="menuitem" class="danger" id="clearNotesItem">清空当前笔记…</a>
        </div>
      </div>
    </div>
  </header>

  <div class="reader-main" id="readerMain">
    <section class="pane" id="paneLeft" data-kind="translated">
      <div class="pane-label"><span>译文</span></div>
      <iframe title="译文" id="frameTranslated"></iframe>
      <div class="pane-state hidden" id="stateTranslated"></div>
    </section>
    <div class="pane-divider" id="divider"></div>
    <section class="pane" id="paneRight" data-kind="original">
      <div class="pane-label"><span>原文</span></div>
      <iframe title="原文" id="frameOriginal"></iframe>
      <div class="pane-state hidden" id="stateOriginal"></div>
    </section>

    <aside class="side-panel hidden" id="notesPanel" aria-label="笔记列表">
      <div class="side-head">
        <strong>笔记</strong>
        <div class="seg-mini" id="notesTarget">
          <button data-target="translated" class="on">译文</button>
          <button data-target="original">原文</button>
        </div>
        <button class="icon-btn" data-close="notesPanel" title="关闭" aria-label="关闭笔记列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="side-body" id="notesBody"></div>
    </aside>

    <aside class="side-panel hidden" id="infoPanel" aria-label="论文信息">
      <div class="side-head">
        <strong>论文信息</strong>
        <span class="spacer"></span>
        <button class="icon-btn" data-close="infoPanel" title="关闭" aria-label="关闭论文信息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="side-body" id="infoBody"></div>
    </aside>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <dialog class="model-dialog" id="modelDialog">
    <form method="dialog">
      <strong>用其他模型重新翻译</strong>
      <p>会创建一条新的翻译记录；现有译文和笔记不受影响。</p>
      <select class="field" id="dialogModel"></select>
      <div class="row">
        <span class="spacer"></span>
        <button class="btn" value="cancel">取消</button>
        <button class="btn primary" value="ok" id="dialogOk">开始翻译</button>
      </div>
    </form>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/reader.js"></script>
</body>
</html>
